name: Release Pipeline

on:
  push:
    branches:
      - 'master'
      - 'fix/ci-debug'
    tags:
      - '*'

jobs:
  build-and-package:
    name: Build & Pack on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Setup Emscripten (linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: mymindstorm/setup-emsdk@v14
        with: 
          version: 'latest' 

      - name: Build libcube 
        shell: bash 
        run: | 
          chmod +x scripts/*.sh
          ./scripts/build_libcube.sh package
      
      - name: Pack pycube
        shell: bash
        env:
          BUILD_SDIST: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
          PYCUBE_LIB_DIR: ${{ github.workspace }}/dist/_LIB
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          pip install build
          ./scripts/pack_pycube.sh
      
      - name: Pack jscube (linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          ./scripts/pack_jscube.sh
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*
            !dist/_LIB
            !dist/_LIB/**
          if-no-files-found: ignore

  publish-release:
    name: Create GitHub Release
    needs: [build-and-package]
    if: |
      startsWith(github.ref, 'refs/tags/') && (
        github.event.base_ref == 'refs/heads/main' || 
        github.event.base_ref == 'refs/heads/master'
      ) &&
      !contains(github.event.base_ref,'fix/')
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_dist
          merge-multiple: true

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          files: all_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}