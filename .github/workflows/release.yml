name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'ci/**'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Pack on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            cmake_flags: ""
          - os: macos-latest
            arch: x86_64
            cmake_flags: "-DBUILD_SWIFT_MODULE=on -DCMAKE_OSX_ARCHITECTURES=x86_64"
            generator: "-G Ninja"
          - os: macos-latest
            arch: arm64
            cmake_flags: "-DBUILD_SWIFT_MODULE=on -DCMAKE_OSX_ARCHITECTURES=arm64"
            generator: "-G Ninja"
          - os: windows-latest
            arch: x64
            cmake_flags: ""
            generator: "-G Ninja"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Ninja (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install ninja

      - name: Setup MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.generator }} \
            ${{ matrix.cmake_flags }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: cmake --build build --target package --config Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/dist/*
            !build/dist/_CPack_Packages
          if-no-files-found: error

  build-xcframework:
    name: Build XCFramework (universal)
    runs-on: macos-latest
    outputs:
      checksum: ${{ steps.compute_checksum.outputs.checksum }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Ninja
        run: brew install ninja

      - name: Configure
        shell: bash
        run: |
          cmake -G Ninja -B build

      - name: Build XCFramework
        shell: bash
        run: bash dev/scripts/build_xcfw.sh dist

      - name: Compute XCFramework Checksum
        id: compute_checksum
        shell: bash
        run: |
          checksum=$(shasum -a 256 dist/cube.xcframework.zip | cut -d' ' -f1)
          echo "checksum=$checksum" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist-xcframework
          path: dist/cube.xcframework.zip
          if-no-files-found: error

  publish-release:
    name: Create GitHub Release
    needs: [build-and-package, build-xcframework]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dists
          merge-multiple: true

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          files: dists/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-spm-publish:
    name: Push to coshz/cube-spm
    needs: [build-xcframework, publish-release]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      CHECKSUM: ${{ needs.build-xcframework.outputs.checksum }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: coshz/cube-spm
          ref: main
          token: ${{ secrets.SPM_REPO_TOKEN }}
          fetch-depth: 0

      - name: Update Package.swift
        run: |
          NEW_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/cube.xcframework.zip"
          sed -i "s|url:[[:space:]]*\"[^\"]*\"|url: \"${NEW_URL}\"|g" Package.swift
          sed -i "s|checksum:[[:space:]]*\"[^\"]*\"|checksum: \"${CHECKSUM}\"|g" Package.swift

          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add Package.swift

          if git diff --cached --quiet; then
            echo "Package.swift: No change; skip commit."
            exit 0
          fi

          git commit -m "chore: release ${TAG}"
          git tag "${TAG}"
          git push origin "HEAD:main"
          git push origin "refs/tags/${TAG}"
