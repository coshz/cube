name: Release Pipeline

on:
  push:
    tags:
      - '*'

jobs:
  build-core:
    name: Build core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build libcube
        shell: bash 
        run: | 
          chmod +x scripts/*.sh
          ./scripts/build_libcube.sh package

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
  
  package-pycube:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: build-core 
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python build tools
        run: pip install build

      - name: Build pycube
        run: | 
          chmod +x scripts/*.sh
          ./scripts/pack_pycube.sh
      
      - uses: actions/upload-artifact@v4
        with:
          name: pycube
          path: dist/*

  package-jscube: 
    name: Build JavaScript package
    runs-on: ubuntu-latest
    needs: build-core

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Build jscube
        run: |
          chmod +x scripts/*.sh
          ./scripts/pack_jscube.sh
      
      - uses: actions/upload-artifact@v4
        with:
          name: jscube
          path: dist/*

  publish-release:
    name: Create GitHub Release
    needs: [build-core, package-pycube, package-jscube]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_dist
          merge-multiple: true

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          files: all_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}